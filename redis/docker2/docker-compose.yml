version: "3.9"

services:

  s_redis:
    image: redis:latest
    container_name: s_redis
    networks:
      - myredis
    # Redis est le service central : il stocke la file de messages.

  s_prod:
    build:
      context: .
      dockerfile: Dockerfile_p
    container_name: s_prod
    depends_on:
      - s_redis
    networks:
      - myredis
    # Le producer dépend de Redis : il doit attendre que Redis soit prêt.

  s_cons:
    build:
      context: .
      dockerfile: Dockerfile_c
    container_name: s_cons
    depends_on:
      - s_redis
    networks:
      - myredis
    # Le consumer dépend aussi de Redis : même logique.

networks:
  myredis:
    driver: bridge
    # Réseau interne Docker Compose permettant aux services de communiquer
    # via leurs noms (s_redis, s_prod, s_cons).
